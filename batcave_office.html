<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Batcave Office — Grok Bots</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #07070f; color: #eee; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
#controls { position: fixed; top: 6px; left: 6px; right: 6px; z-index: 100; display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; background: rgba(10,10,20,0.94); padding: 6px; border-radius: 12px; border: 1px solid #2a2a40; max-height: 100px; overflow-y: auto; }
#controls button { background: #151525; color: #ccc; border: 1px solid #333; padding: 5px 9px; border-radius: 6px; cursor: pointer; font-size: 11px; }
#controls button.active { background: #3a1a5a; color: #fff; border-color: #6a3aaa; }
#canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
.todo-board { position: absolute; background: rgba(8,16,32,0.94); border: 1px solid #2a5a8a; border-radius: 10px; padding: 10px; font-size: 11px; max-width: 240px; pointer-events: none; z-index: 50; }
.todo-board h3 { margin: 0 0 6px; color: #5af; font-size: 12px; }
.todo-item { margin: 3px 0; line-height: 1.3; }
.todo-item.working { color: #6f8; }
.todo-item.idle { color: #999; }
.cabin-screen { position: absolute; background: rgba(5,15,30,0.96); border: 2px solid #2a6aaa; border-radius: 8px; padding: 10px; font-size: 11px; pointer-events: none; z-index: 50; display: none; }
</style>
</head>
<body>
<div id="controls">
  <button data-floors="all" class="active">All Floors</button>
  <button data-floors="club,litigation">Club + Litigation</button>
  <button data-floors="club,trading">Club + Trading</button>
  <button data-floors="litigation,trading">Litigation + Trading</button>
  <button data-floors="club">Club House</button>
  <button data-floors="litigation">Litigation Lab</button>
  <button data-floors="trading">Trading Floor</button>
  <button data-floors="ground">Ground Floor</button>
</div>
<canvas id="canvas"></canvas>
<div id="todo-litigation" class="todo-board" style="display:none;"><h3>LITIGATION LAB — Shared To-Do</h3><div id="todo-litigation-list"></div></div>
<div id="todo-trading" class="todo-board" style="display:none;"><h3>TRADING FLOOR — Shared To-Do</h3><div id="todo-trading-list"></div></div>
<div id="cabin-screen" class="cabin-screen"><strong>BATCAVE CONTROL // SNAPSHOT</strong><br>Active: <span id="stat-active">0</span> &nbsp; Idle: <span id="stat-idle">0</span><br>Lit working: <span id="stat-lit">0</span> &nbsp; Trade working: <span id="stat-trade">0</span></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; positionOverlays(); }
addEventListener('resize', resize); resize();

const floors = {
  club: { name: 'Club House', color: '#140a22', accent: '#6a3aaa' },
  litigation: { name: 'Litigation Lab', color: '#12180a', accent: '#4a8a3a' },
  trading: { name: 'Trading Floor', color: '#0a1618', accent: '#3a6aaa' },
  ground: { name: 'Ground Floor', color: '#121212', accent: '#555' }
};

let visibleFloors = ['club','litigation','trading','ground'];

// Current snapshot of your real bots (refreshed when this file is regenerated)
const agents = [
  { name: 'Strict Legal Reviewer', group: 'litigation', floor: 'litigation', status: 'idle', x: 0.22, task: 'Reviewing summaries' },
  { name: 'Legal Judgment Framework', group: 'litigation', floor: 'litigation', status: 'idle', x: 0.40, task: 'Building framework' },
  { name: 'Litigation Lab Lead', group: 'litigation', floor: 'litigation', status: 'working', x: 0.58, task: 'Coordinating lab' },
  { name: 'Legal Quant Analytics', group: 'litigation', floor: 'litigation', status: 'working', x: 0.75, task: 'Quant research' },
  { name: 'Litigation Data Engineer', group: 'litigation', floor: 'litigation', status: 'idle', x: 0.30, task: 'Data pipelines' },
  { name: 'Trading Chief of Staff', group: 'trading', floor: 'trading', status: 'idle', x: 0.25, task: 'Desk coordination' },
  { name: 'Market Scout', group: 'trading', floor: 'trading', status: 'idle', x: 0.42, task: 'Scanning markets' },
  { name: 'Strategy Researcher', group: 'trading', floor: 'trading', status: 'idle', x: 0.58, task: 'Backtesting plans' },
  { name: 'Risk Officer', group: 'trading', floor: 'trading', status: 'idle', x: 0.72, task: 'Risk checks' },
  { name: 'Quant Math Expert', group: 'trading', floor: 'trading', status: 'idle', x: 0.35, task: 'Quant analysis' },
  { name: 'Usage Saver', group: 'ground', floor: 'ground', status: 'idle', x: 0.40, task: null },
  { name: 'Unassigned', group: 'ground', floor: 'ground', status: 'idle', x: 0.65, task: null }
];

// Move idle non-ground bots to club house for display
agents.forEach(a => {
  if (a.status === 'idle' && a.group !== 'ground') a.floor = 'club';
});

function updateOverlays() {
  const litList = document.getElementById('todo-litigation-list');
  const tradeList = document.getElementById('todo-trading-list');
  litList.innerHTML = '';
  tradeList.innerHTML = '';
  const lit = agents.filter(a => a.group === 'litigation');
  const trade = agents.filter(a => a.group === 'trading');
  lit.forEach(a => {
    const d = document.createElement('div');
    d.className = 'todo-item ' + a.status;
    d.textContent = a.status === 'working' ? `● ${a.name}: ${a.task}` : `○ ${a.name}: Idle (club)`;
    litList.appendChild(d);
  });
  trade.forEach(a => {
    const d = document.createElement('div');
    d.className = 'todo-item ' + a.status;
    d.textContent = a.status === 'working' ? `● ${a.name}: ${a.task}` : `○ ${a.name}: Idle (club)`;
    tradeList.appendChild(d);
  });
  const active = agents.filter(a => a.status === 'working').length;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-idle').textContent = agents.length - active;
  document.getElementById('stat-lit').textContent = lit.filter(a => a.status === 'working').length;
  document.getElementById('stat-trade').textContent = trade.filter(a => a.status === 'working').length;
}
updateOverlays();

document.getElementById('controls').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  const f = e.target.dataset.floors;
  visibleFloors = f === 'all' ? Object.keys(floors) : f.split(',');
  positionOverlays();
});

function positionOverlays() {
  const lit = document.getElementById('todo-litigation');
  const trade = document.getElementById('todo-trading');
  const cabin = document.getElementById('cabin-screen');
  lit.style.display = visibleFloors.includes('litigation') ? 'block' : 'none';
  trade.style.display = visibleFloors.includes('trading') ? 'block' : 'none';
  cabin.style.display = visibleFloors.includes('club') ? 'block' : 'none';
  if (visibleFloors.includes('litigation')) { lit.style.left = '10px'; lit.style.top = '110px'; }
  if (visibleFloors.includes('trading')) { trade.style.right = '10px'; trade.style.top = '110px'; }
  if (visibleFloors.includes('club')) { cabin.style.left = '10px'; cabin.style.top = '110px'; }
}
positionOverlays();

function drawFloor(key, y, floorH) {
  const f = floors[key];
  ctx.fillStyle = f.color;
  ctx.fillRect(16, y, W - 32, floorH - 6);
  ctx.strokeStyle = '#222';
  ctx.strokeRect(16, y, W - 32, floorH - 6);
  ctx.fillStyle = f.accent;
  ctx.font = 'bold 13px system-ui';
  ctx.fillText(f.name, 26, y + 20);

  if (key === 'club') {
    ctx.strokeStyle = '#4a8aff';
    ctx.lineWidth = 2;
    ctx.strokeRect(W * 0.32, y + 30, W * 0.36, floorH - 50);
    ctx.fillStyle = 'rgba(40,80,140,0.12)';
    ctx.fillRect(W * 0.32, y + 30, W * 0.36, floorH - 50);
    ctx.fillStyle = '#6af';
    ctx.font = '10px system-ui';
    ctx.fillText('ONE-WAY GLASS CABIN', W * 0.33 + 4, y + 46);
    ctx.fillStyle = '#2a1a40';
    ctx.fillRect(30, y + floorH * 0.42, 100, 32);
    ctx.fillStyle = '#8af';
    ctx.fillText('BAR', 60, y + floorH * 0.42 + 20);
    ctx.fillStyle = '#1a3a2a';
    ctx.fillRect(W * 0.62, y + floorH * 0.35, 85, 40);
    ctx.fillStyle = '#6f8';
    ctx.fillText('POOL', W * 0.62 + 22, y + floorH * 0.35 + 24);
  } else if (key === 'litigation') {
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = '#2a3a1a';
      ctx.fillRect(40 + i * 100, y + floorH * 0.35, 75, 36);
    }
  } else if (key === 'trading') {
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = '#1a2a3a';
      ctx.fillRect(30 + i * 85, y + floorH * 0.32, 65, 38);
    }
  } else {
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = '#222';
      ctx.fillRect(50 + i * 120, y + floorH * 0.4, 85, 28);
    }
  }

  agents.filter(a => a.floor === key).forEach(a => {
    const ax = 30 + a.x * (W - 80);
    const ay = y + floorH * 0.62;
    ctx.fillStyle = a.status === 'working' ? '#4af' : '#8af';
    ctx.beginPath();
    ctx.arc(ax, ay, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '9px system-ui';
    const short = a.name.split(' ')[0];
    ctx.fillText(short, ax - ctx.measureText(short).width / 2, ay - 11);
  });
}

function draw() {
  ctx.fillStyle = '#07070f';
  ctx.fillRect(0, 0, W, H);
  const count = visibleFloors.length || 1;
  const floorH = (H - 110) / count;
  const startY = 108;
  visibleFloors.forEach((key, i) => drawFloor(key, startY + i * floorH, floorH));
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
